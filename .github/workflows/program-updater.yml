name: Validate Windows program updater
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update verification, data retention and rollback
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File studio/tests/test_updater.ps1
      - name: Release catalogue and interrupted-update recovery
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File studio/tests/test_release_catalog.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File studio/tests/test_update_recovery.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File studio/tests/test_update_boundaries.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File studio/tests/test_release_catalog_boundaries.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File studio/tests/test_payload_boundaries.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Launcher lifetime and Python environment isolation
        run: |
          python studio/tests/test_launch_lifetime.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python studio/tests/test_launch_environment.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: API, support, controller and build regressions without GPU
        run: |
          python -m pip install aiohttp pillow psutil
          python -m unittest discover -s studio/tests -p "test_*.py" -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Image upload and status ordering in the UI
        run: node studio/tests/test_upload_ui.js
