name: Validate native node package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest==8.4.2 numpy pillow scipy
      - name: CPU lifecycle and transactional-state regressions
        run: python tests/run_cpu_lifecycle_tests.py
